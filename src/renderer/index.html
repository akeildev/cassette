<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassette Voice Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Drag Region -->
        <div class="drag-region">
            <!-- Window Controls -->
            <div class="window-controls">
                <button class="close-button" id="closeButton" title="Close">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
                        <path d="M11.7 0.3c-0.4-0.4-1-0.4-1.4 0L6 4.6 1.7 0.3c-0.4-0.4-1-0.4-1.4 0s-0.4 1 0 1.4L4.6 6 0.3 10.3c-0.4 0.4-0.4 1 0 1.4s1 0.4 1.4 0L6 7.4l4.3 4.3c0.4 0.4 1 0.4 1.4 0s0.4-1 0-1.4L7.4 6l4.3-4.3C12.1 1.3 12.1 0.7 11.7 0.3z"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Main Container -->
        <div class="container">
            <!-- Cassette Tape with integrated controls -->
            <div class="tape-section">
                <!-- Left reel becomes REC button -->
                <button class="tape-reel-button rec-button" id="voiceButton">
                    <span class="reel-text">REC</span>
                </button>
                
                <div class="tape-center">
                    <div class="tape-controls">
                        <div class="status-indicator" id="statusIndicator">
                            <span class="status-dot"></span>
                            <span class="status-text">Ready</span>
                        </div>
                        <div class="audio-leds" id="audioLeds" style="display: none;">
                            <span class="audio-led" data-level="1"></span>
                            <span class="audio-led" data-level="2"></span>
                            <span class="audio-led" data-level="3"></span>
                            <span class="audio-led" data-level="4"></span>
                            <span class="audio-led" data-level="5"></span>
                        </div>
                    </div>
                </div>
                
                <!-- Right reel becomes MUTE button -->
                <button class="tape-reel-button mute-button" id="muteButton">
                    <span class="reel-text" id="muteText">MUTE</span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- LiveKit SDK from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.2/dist/livekit-client.umd.min.js"></script>
    <script>
        // Make LiveKit available globally
        window.LivekitClient = window.LivekitClient || window.LiveKit;
    </script>
    
    <!-- Load additional scripts -->
    <script src="livekitClient.js"></script>
    <script src="audioVisualizer.js"></script>
    <script src="screenshotClient.js"></script>
    
    <!-- Main UI script loaded last -->
    <script src="index.js"></script>
</body>
</html>
